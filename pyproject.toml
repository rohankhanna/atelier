[project]
name = "atelier"
version = "0.1.0"
description = "Pass-backed OAuth credential custody for local LLM tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atelier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
